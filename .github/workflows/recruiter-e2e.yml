name: Recruiter browser checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  recruiter-e2e:
    name: Mobile, recruiter flow and CV print (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build with bounded retry for intermittent Google Fonts transport failures
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "::warning::Build attempt $attempt failed; retrying after clearing generated output."
            rm -rf .next
            sleep $((attempt * 4))
          done
          exit 1
      # ubuntu-latest already ships Google Chrome; avoid a network-dependent browser download.
      - run: google-chrome --version
      - run: npx playwright test e2e/recruiter-journey.spec.ts
        env:
          CI: "true"
      - name: Keep screenshots, HTML report and print PDFs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recruiter-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
